<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Blur — Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="noun-blur-on-4180752.svg" alt="Page Blur icon" class="app-icon" />
        <h1>Page Blur</h1>
        <p class="version">Version 1.0.0</p>
      </header>

      <section>
        <h2>About</h2>
        <p>
          Page Blur lets you blur the current tab with a slider. The blur stays
          active as you navigate within the same tab, and resets when you click
          the&nbsp;&#x2715;&nbsp;button or close the tab.
        </p>
      </section>

      <section>
        <h2>Attribution</h2>
        <p>
          Icon: "blur on" by Justin Blake from
          <a
            href="https://thenounproject.com/browse/icons/term/blur-on/"
            target="_blank"
            rel="noopener noreferrer"
            title="blur on Icons"
          >Noun Project</a>
          (CC BY 3.0)
        </p>
      </section>
    </main>
  </body>
</html>
